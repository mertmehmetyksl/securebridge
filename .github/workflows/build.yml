name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter websockets cryptography
    
    - name: Build EXE
      run: |
        pyinstaller --onefile --name SecureBridge --add-data ".;." --hidden-import=ctypes --collect-all customtkinter main.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SecureBridge-exe
        path: dist/SecureBridge.exe
    
    - name: Upload to Release
      if: github.event_name == 'push' && !github.event.repository.fork
      uses: softprops/action-gh-release@v1
      with:
        files: dist/SecureBridge.exe
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}